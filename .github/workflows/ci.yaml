name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_COVERAGE_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history to detect "new code"

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"mgendre_green-genius"
          /o:"mgendre"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          /d:sonar.exclusions="**/Migrations/**,**/*generated.*,**/shared/spartan/helm/**"
          /d:sonar.coverage.exclusions="GreenGenius.Frontend/**"

      - name: Build
        run: dotnet build --no-restore --no-incremental

      - name: Test with coverage
        run: dotnet coverage collect "dotnet test --no-build" -f xml -o coverage.xml

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GreenGenius.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: GreenGenius.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright tests
        run: npm run e2e
